# font_family Cascadia Mono
font_size 11.0
background_opacity 0.5
cursor_trail 1
confirm_os_window_close 0
update_check_interval 0

# Run kitten themes, then select the theme you want, it will autoload it there
# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

background #000000



# BEGIN_KITTY_FONTS
font_family      family="CaskaydiaCove Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
